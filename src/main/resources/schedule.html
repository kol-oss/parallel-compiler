<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block Occupancy</title>
    <style>
        body {
            margin: 2rem;
            color: #1f2937;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        h1,
        h2 {
            margin: 0 0 1rem;
            font-size: 1.4rem;
            font-weight: 600;
        }

        h2 {
            margin-top: 2rem;
        }

        .expression,
        .processed-expression,
        .durations {
            margin: 0 0 0.5rem;
        }

        table {
            margin-top: 1rem;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.45rem 0.7rem;
            border: 1px solid #d1d5db;
            text-align: center;
            white-space: nowrap;
        }

        thead th {
            background: #f3f4f6;
            font-weight: 600;
        }

        tbody th {
            background: #f9fafb;
            text-align: left;
        }

        .block-P {
            color: #2563eb;
        }

        .block-S {
            color: #16a34a;
        }

        .block-M {
            color: #ea580c;
        }

        .block-D {
            color: #9333ea;
        }

        .cell-P {
            background: rgba(37, 99, 235, 0.14);
        }

        .cell-S {
            background: rgba(22, 163, 74, 0.14);
        }

        .cell-M {
            background: rgba(234, 88, 12, 0.14);
        }

        .cell-D {
            background: rgba(147, 51, 234, 0.14);
        }

        .metrics {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .metrics li {
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>
    <h1>Block Occupancy</h1>
    <div id="content">Loading schedule.json...</div>

    <script>
        const content = document.getElementById('content');
        let lastPayload = '';

        async function loadSchedule() {
            try {
                const response = await fetch('schedule.json?t=' + Date.now(), { cache: 'no-store' });

                if (!response.ok)
                    throw new Error(response.status + ' ' + response.statusText);

                const data = await response.json();
                const payload = JSON.stringify(data);

                if (payload === lastPayload)
                    return;

                lastPayload = payload;
                render(data);
            } catch (error) {
                content.textContent = 'Could not load schedule.json: ' + error.message;
            }
        }

        function render(data) {
            content.replaceChildren();

            const expression = document.createElement('p');
            expression.className = 'expression';
            expression.textContent = 'Expression: ' + (data.expression || '');
            content.append(expression);

            const processed = document.createElement('p');
            processed.className = 'processed-expression';
            const processedLabel = document.createElement('span');
            processedLabel.textContent = 'Processed Expression: ';
            const processedValue = document.createElement('strong');
            processedValue.textContent = data.processedExpression || '';
            processed.append(processedLabel, processedValue);
            content.append(processed);

            const durations = document.createElement('p');
            durations.className = 'durations';
            durations.textContent = 'Operation durations: ' + (data.durations || [])
                    .map(item => item.symbol + ' = ' + item.duration)
                    .join(', ');
            content.append(durations);

            if (!data.parallelTime) {
                const empty = document.createElement('p');
                empty.textContent = 'No operations to display.';
                content.append(empty);
                return;
            }

            const table = document.createElement('table');
            const head = document.createElement('thead');
            const headRow = document.createElement('tr');
            const blockHead = document.createElement('th');
            blockHead.textContent = 'Block';
            headRow.append(blockHead);

            for (let tick = 1; tick <= data.parallelTime; tick++) {
                const cell = document.createElement('th');
                cell.textContent = tick;
                headRow.append(cell);
            }

            head.append(headRow);
            table.append(head);

            const body = document.createElement('tbody');

            for (const block of data.blocks) {
                const row = document.createElement('tr');
                const blockCell = document.createElement('th');
                blockCell.className = 'block-' + block.operator;
                blockCell.textContent = block.id;
                row.append(blockCell);

                let tick = 0;

                while (tick < data.parallelTime) {
                    const entry = data.entries.find(item => item.block === block.id && item.start === tick);
                    const cell = document.createElement('td');

                    if (entry) {
                        cell.className = 'cell-' + block.operator;
                        cell.colSpan = entry.duration;
                        cell.textContent = entry.operation;
                        tick += entry.duration;
                    } else {
                        cell.textContent = '';
                        tick++;
                    }

                    row.append(cell);
                }

                body.append(row);
            }

            table.append(body);
            content.append(table);

            const metricsTitle = document.createElement('h2');
            metricsTitle.textContent = 'Metrics';
            content.append(metricsTitle);

            const metrics = document.createElement('ul');
            metrics.className = 'metrics';
            const sequential = document.createElement('li');
            sequential.textContent = 'Sequential time: ' + data.sequentialTime;
            const parallel = document.createElement('li');
            parallel.textContent = 'Parallel time: ' + data.parallelTime;
            const speedup = document.createElement('li');
            speedup.textContent = 'Speedup: ' + data.sequentialTime + ' / ' + data.parallelTime
                    + ' = ' + data.speedup.toFixed(2);
            const efficiency = document.createElement('li');
            efficiency.textContent = 'Efficiency: ' + data.speedup.toFixed(2) + ' / ' + data.blockCount
                    + ' = ' + data.efficiency.toFixed(2) + ' (' + (data.efficiency * 100).toFixed(2) + '%)';

            metrics.append(sequential, parallel, speedup, efficiency);
            content.append(metrics);
        }

        loadSchedule();
        setInterval(loadSchedule, 1000);
    </script>
</body>
</html>
